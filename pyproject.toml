[project]
name = "feishu-dispatcher"
version = "0.0.1"
description = "Feishu-driven personal coding agent dispatcher"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-client-protocol>=0.12.1",
    "httpx>=0.28.1",
    "lark-oapi>=1.7.3",
]

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
]

[project.scripts]
feishu-dispatcher = "feishu_dispatcher.cli:main"
fdx = "feishu_dispatcher.agent_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["feishu_dispatcher/webui/*.js"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "UP035"]

[tool.pyright]
include = ["feishu_dispatcher"]
exclude = ["build", "scripts", "tests", "feishu_dispatcher/webui"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportPrivateUsage = "error"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "webui_e2e: requires a Playwright Chromium installation",
]
testpaths = ["tests"]
