<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>feishu-dispatcher · HTTP Channel</title>
    <link rel="stylesheet" href="/webui/style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">feishu-dispatcher</p>
          <h1>HTTP Channel</h1>
          <p class="subtitle">一个 HTTP Channel 内的多 Task 交互窗口</p>
        </div>
        <div id="status" class="status" data-tone="idle" role="status">
          请输入 token
        </div>
      </header>

      <section class="connection panel" aria-labelledby="connection-title">
        <div class="section-heading">
          <div>
            <p class="section-kicker">Connection</p>
            <h2 id="connection-title">连接设置</h2>
          </div>
          <button id="reset-conversation" class="button button-quiet" type="button">
            新建 Conversation
          </button>
        </div>

        <div class="connection-grid">
          <label class="field" for="token">
            <span>Bearer token</span>
            <input
              id="token"
              name="token"
              type="password"
              autocomplete="off"
              spellcheck="false"
              placeholder="读取 http-channel.token"
            />
          </label>
          <button id="connect" class="button button-primary" type="button">连接</button>
        </div>

        <div class="conversation-meta">
          <span>Conversation</span>
          <code id="conversation-id"></code>
          <span>Cursor</span>
          <code id="cursor">0</code>
        </div>
        <p class="hint">token 仅保存在当前页面内存；刷新后需要重新输入。</p>
      </section>

      <div class="workspace">
        <section class="task-panel panel" aria-labelledby="task-title">
          <div class="section-heading">
            <div>
              <p class="section-kicker">Tasks</p>
              <h2 id="task-title">选择会话目标</h2>
            </div>
          </div>
          <div id="task-list" class="task-list">
            <p class="task-list-empty">连接后加载 Task。</p>
          </div>
        </section>

        <div class="conversation-column">
          <section class="timeline-panel panel" aria-labelledby="timeline-title">
            <div class="section-heading">
              <div>
                <p class="section-kicker">Events</p>
                <h2 id="timeline-title">当前 Task</h2>
              </div>
              <span class="live-dot"><span></span> cursor polling</span>
            </div>
            <div class="current-target">
              <strong id="current-task">Dispatcher</strong>
              <code id="current-thread">root</code>
            </div>
            <div
              id="timelines"
              class="timelines"
              aria-live="polite"
              aria-relevant="additions"
            ></div>
          </section>

          <form id="composer" class="composer panel">
            <label class="field" for="message">
              <span id="composer-target">发送给 Dispatcher</span>
              <textarea id="message" name="message" rows="3" required>/help</textarea>
            </label>
            <div class="composer-actions">
              <span>Ctrl / ⌘ + Enter 发送</span>
              <button id="send" class="button button-primary" type="submit">
                发送
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <script type="module" src="/webui/app.js"></script>
  </body>
</html>
